name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      # g++ is preinstalled on ubuntu-latest; Java is pinned for the Java lesson compile check
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Check every lesson
        run: node tools/verify.mjs

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # The site as one zip for offline use (the "Use offline" card links to it). Built here, not
      # committed: a copy of site/ plus a zip of site/ inside it.
      - name: Add the offline zip
        run: |
          cp -r site _site
          (cd site && zip -qr -X ../_site/blackout-coder-offline.zip . -x sw.js)
          ls -la _site/blackout-coder-offline.zip
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
